[package]
name = "bevyr"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_state"] }
bevy_ratatui = "0.12"
color-eyre = "0.6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
